[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewflow-backend"
version = "0.1.0"
description = "ReviewFlow AI FastAPI backend with Supabase storage"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.36,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "fastapi-users[sqlalchemy]>=14,<15",
  "Pillow>=11,<13",
  "qrcode>=8,<9",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a dedicated disposable Supabase/PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
