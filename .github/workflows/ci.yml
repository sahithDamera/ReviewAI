name: ReviewFlow CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reviewflow_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: reviewflow_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U reviewflow_test -d reviewflow_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.lock
      - run: python -m ruff check app migrations tests
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://reviewflow_test:local-test-only@127.0.0.1:55432/reviewflow_test
          TEST_DATABASE_URL: postgresql+psycopg://reviewflow_test:local-test-only@127.0.0.1:55432/reviewflow_test
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://reviewflow_test:local-test-only@127.0.0.1:55432/reviewflow_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
