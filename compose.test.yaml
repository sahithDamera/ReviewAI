# Disposable PostgreSQL engine for migration tests only. Hosted storage is Supabase.
services:
  database-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reviewflow_test
      POSTGRES_USER: reviewflow_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewflow_test -d reviewflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
